<!DOCTYPE html>
<html lang="en">
<head>
    <title>Voice to Sign Language Translator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
    <h1>🎤 Voice2Sign </h1>
    <p>Convert Speech & Text into Sign Language</p>
</div>

    <nav class="navbar">
        <h2>🧠 Voice2Sign AI</h2>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Translator</li>
            <li>Contact</li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Convert Speech to Sign Language Instantly</h1>
        <p class="subtitle">AI-powered real-time translation system</p>

        <button id="startBtn">🎤 Start Speaking</button>

        <div class="input-section">
     <input type="text" id="textInput" placeholder="Or type your sentence here..." />
     <button onclick="sendText()">Translate</button>
     </div>
        <div class="output-box">
            <p id="outputText">Your speech will appear here...</p>
        </div>

        <div class="output-box ai">
            <p id="aiResult">AI result will appear here...</p>
        </div>

        <div id="signContainer" class="sign-container"></div>
    </section>

</body>
<script src="/static/script.js"></script>
</html>
